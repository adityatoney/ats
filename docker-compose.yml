services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: aegis-server
    ports:
      - "${ATS_PORT_SERVER:-10111}:3001"
    environment:
      CONVEX_URL: ${CONVEX_URL}
      PORT: "3001"
      PYTHON_RUNTIME_URL: http://runtime:8000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  runtime:
    build:
      context: .
      dockerfile: packages/runtime/Dockerfile
    container_name: aegis-runtime
    ports:
      - "${ATS_PORT_RUNTIME:-10112}:8000"
    environment:
      NODE_SERVER_URL: http://server:3001
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ${SSD_DATA}/ats/aegis:/app/data
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_CONVEX_URL: ${CONVEX_URL}
    container_name: aegis-web
    ports:
      - "${ATS_PORT_WEB:-10113}:5173"
    depends_on:
      server:
        condition: service_healthy
